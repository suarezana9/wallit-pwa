<ion-header class="ion-no-border ion-hide-lg-up">
  <ion-toolbar>
    <ion-title>{{ 'navMovements' | t }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content appFabAutoHide>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  <div class="wl-page">
    <app-context-switcher class="switcher ion-hide-lg-up" />
    <header class="wl-page-header ion-hide-lg-down">
      <div class="wl-page-title">
        <h1>{{ 'navMovements' | t }}</h1>
        <p>{{ activeGroup()?.name ?? ('movementsSubtitle' | t) }}</p>
      </div>
      <ion-button class="wl-btn wl-btn-primary" (click)="editor().openNew()">
        <ion-icon slot="start" name="add" />
        {{ 'newMovement' | t }}
      </ion-button>
    </header>

    <app-movement-explorer
      [groupId]="groupId()"
      [members]="members()"
      [fileName]="fileName()"
      (selected)="editor().openEdit($event)"
      (removed)="editor().confirmRemove($event)"
    />
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end" class="ion-hide-lg-up">
    <ion-fab-button (click)="editor().openNew()" [attr.aria-label]="'newMovement' | t">
      <ion-icon name="add" />
    </ion-fab-button>
  </ion-fab>

  <app-movement-editor (changed)="explorer().reload()" />
</ion-content>
